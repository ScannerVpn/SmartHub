name: Release Build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  workflow_dispatch:

env:
  CI: true

permissions:
  contents: read
  issues: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Cargo check (core logic)
        working-directory: src-tauri
        run: |
          cargo check --message-format=short 2>&1 | Tee-Object -FilePath ../ci-cargo.log
          exit $LASTEXITCODE

      - name: Build installers
        run: |
          npm run tauri build 2>&1 | Tee-Object -FilePath ci-bundle.log
          exit $LASTEXITCODE

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smarthub-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      # Sandbox-readable diagnostics: CI logs live on blob storage that the
      # agent's network can't reach, so post the tail as an issue comment.
      - name: Post failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $body = "## CI failure diagnostics (run ${{ github.run_id }}, ${{ github.sha }})`n`n"
          foreach ($f in @("ci-cargo.log", "ci-bundle.log")) {
            if (Test-Path $f) {
              $body += "### $f (tail)`n``````text`n" + (Get-Content $f -Tail 150 | Out-String) + "`n```````n`n"
            }
          }
          $body | gh issue create --repo ${{ github.repository }} --title "[ci-diag] build failure ${{ github.run_number }}" --body-file - | Out-Null
